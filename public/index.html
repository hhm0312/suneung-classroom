<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="실제 수능 시간표와 타종으로 진행되는 3D 고사실. 같은 교실에 들어온 사람들과 함께, 각자 자기 진도로 시험을 봅니다.">
<title>온라인 수능 고사장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 화면 전체가 3D 고사실. 위쪽 양끝에 상태 막대, 아래 가운데에 진행 도크, 설정은 오른쪽 시트 */
:root{
  --stage:#221C17;
  --glass:rgba(30,25,21,.66); --glass-strong:rgba(34,29,24,.84); --card:rgba(255,248,236,.07); --card-line:rgba(255,244,228,.12);
  --line:rgba(255,244,228,.14); --ink:#F7F2E9; --muted:rgba(247,242,233,.62); --faint:rgba(247,242,233,.38); --hover:rgba(255,244,228,.09);
  --gold:#A38C55; --gold-hi:#CDB577; --gold-ink:#FFFDF7;
  --entry:#9AA3A8; --yebi:#E2A43B; --junbi:#E07B3A; --exam:#6C93DB; --late:#F0738A; --swap:#93AB82; --track:rgba(255,244,228,.12);
  --serif:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --gt:calc(env(safe-area-inset-top, 0px) + 14px); --gb:calc(env(safe-area-inset-bottom, 0px) + 16px);
  --blur:blur(18px) saturate(1.2);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--stage)}
body{font-family:var(--sans);font-size:15px;color:var(--ink);padding-left:var(--gl);padding-right:var(--gr);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block;width:100%;height:100%}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* ── 상단 ── */
.topbar{position:fixed;z-index:8;top:var(--gt);left:var(--gl);right:var(--gr);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.topbar>*{pointer-events:auto}
.bar-l,.bar-r{display:flex;align-items:center;height:52px;border-radius:18px;padding:0 6px}
.dday{display:grid;place-items:center;height:36px;padding:0 12px;margin-left:2px;border-radius:12px;background:var(--late);color:#fff;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.period{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;margin-left:4px;border-radius:12px;text-align:left}
.period:hover{background:var(--hover)}
.period .t{display:grid;line-height:1.2}
.period b{font-size:16px;font-weight:700;white-space:nowrap}
.period small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{width:18px;height:18px;flex:none;transition:transform .2s;opacity:.8}
[aria-expanded="true"]>.chev{transform:rotate(180deg)}
.clock{display:grid;line-height:1.15;padding:0 12px 0 10px;text-align:right}
.clock b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock small{font-size:11px;color:var(--muted)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.ibtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:12px}
.ibtn:hover{background:var(--hover)}
.ibtn svg{width:21px;height:21px}
.ibtn[aria-pressed="true"]{background:var(--hover)}
.ibtn.off{color:var(--late)}
@media (hover:hover){
  .ibtn::after{content:attr(data-tip);position:absolute;top:calc(100% + 10px);right:0;padding:6px 10px;border-radius:8px;background:#0F0C0A;color:var(--ink);
    font-size:13px;font-weight:500;white-space:nowrap;opacity:0;transform:translateY(-3px);pointer-events:none;transition:opacity .15s,transform .15s}
  .ibtn:hover::after{opacity:1;transform:none}
  .online::after{content:attr(data-tip);position:absolute;top:calc(100% + 10px);right:0;width:max-content;max-width:240px;padding:6px 10px;border-radius:8px;background:#0F0C0A;color:var(--ink);
    font-size:13px;font-weight:500;line-height:1.45;opacity:0;transform:translateY(-3px);pointer-events:none;transition:opacity .15s,transform .15s}
  .online:hover::after{opacity:1;transform:none}
}

/* ── 교시 메뉴 ── */
.menu{position:fixed;z-index:9;left:var(--gl);top:calc(var(--gt) + 60px);width:310px;max-height:calc(100% - var(--gt) - 60px - 200px);overflow:auto;border-radius:18px;padding:6px;background:var(--glass-strong)}
.grp{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;text-align:left}
.grp:hover{background:var(--hover)}
.grp .chev{width:16px;height:16px;transform:rotate(-90deg);opacity:.55}
.grp[aria-expanded="true"] .chev{transform:none}
.grp .nm{font-weight:600;font-size:14px}
.grp .num{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--card);font-size:12px;font-weight:700;color:var(--muted);flex:none}
.grp.cur .num{background:var(--gold);color:var(--gold-ink)}
.grp time{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.evs{display:grid;padding:2px 0 8px 32px;position:relative}
.evs::before{content:"";position:absolute;left:22px;top:6px;bottom:14px;width:1px;background:var(--line)}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;text-align:left}
.ev:hover{background:var(--hover)}
.ev span{font-size:14px}
.ev time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev.main span{font-weight:700}
.ev.past{opacity:.42}
.ev.now{background:var(--ink);color:#1A1612}
.ev.now time{color:inherit;opacity:.7}

/* ── 설정 시트 ── */
.sheet{position:fixed;z-index:10;right:var(--gr);top:calc(var(--gt) + 60px);width:390px;max-height:calc(100% - var(--gt) - 76px);overflow:auto;border-radius:24px;padding:22px 20px 20px;background:var(--glass-strong)}
.online{position:relative;display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;margin:0 4px;border-radius:10px;background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.roomSel select{background:transparent;border:none;color:inherit;font:inherit;font-weight:600;cursor:pointer;outline:none}
.roomSel select option{color:#1a1a1a}
.online i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.online.on i{background:#5BD08A;box-shadow:0 0 0 3px rgba(91,208,138,.22)}
.me-box{display:grid;gap:8px;padding:0 4px 18px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.me-box label{font-size:15px;font-weight:700}
.me-box small{font-size:12px;color:var(--muted)}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--card-line);background:rgba(0,0,0,.22);color:var(--ink);font:inherit;font-size:15px}
.name-row .textbtn{height:40px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.sheet-head h2{margin:0;font-size:22px;font-weight:700}
.xbtn{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--card)}
.xbtn:hover{background:var(--hover)}
.xbtn svg{width:18px;height:18px}
.master{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:2px 4px 18px}
.master b{display:block;font-size:17px;font-weight:700}
.master small{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
.switch{position:relative;width:52px;height:30px;border-radius:999px;background:rgba(255,244,228,.18);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--gold)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.cards{display:grid;gap:12px}
.snd{border:1px solid var(--card-line);background:var(--card);border-radius:20px;padding:16px;display:grid;gap:14px}
.snd.dim .snd-body{opacity:.45}
.snd-head{display:flex;align-items:center;gap:12px}
.ico{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(255,244,228,.09);flex:none}
.ico svg{width:22px;height:22px}
.snd-head .tx{flex:1;min-width:0}
.snd-head b{display:block;font-size:16px;font-weight:700}
.snd-head small{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.pill{min-width:64px;height:38px;padding:0 16px;border-radius:999px;font-weight:700;font-size:14px;background:rgba(255,244,228,.1);color:var(--muted);flex:none}
.pill[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.snd-body{display:grid;gap:12px;transition:opacity .2s}
.vol{display:flex;align-items:center;gap:14px}
.vol output{width:42px;text-align:right;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent;margin:0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--gold) var(--p),rgba(255,244,228,.85) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--gold) var(--p),rgba(255,244,228,.85) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.22)}
.seg button{height:34px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:rgba(255,244,228,.16);color:var(--ink)}
.rounds{display:grid;gap:6px}
.round{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid transparent;text-align:left}
.round:hover{background:var(--hover)}
.round .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);flex:none}
.round[aria-pressed="true"]{border-color:var(--card-line);background:rgba(255,244,228,.06)}
.round[aria-pressed="true"] .dot{border-color:var(--gold-hi);background:radial-gradient(var(--gold-hi) 42%,transparent 48%)}
.round .nm{font-size:14px;font-weight:600}
.round time{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{display:flex;gap:8px;margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.note::before{content:"";width:5px;height:5px;margin-top:7px;border-radius:50%;background:var(--gold-hi);flex:none}
.textbtn{justify-self:start;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--card-line);font-size:13px;font-weight:600}
.textbtn:hover{background:var(--hover)}

/* ── 알림 ── */
.toast{position:fixed;z-index:12;left:50%;top:calc(var(--gt) + 64px);transform:translate(-50%,-8px);opacity:0;pointer-events:none;max-width:calc(100% - 32px);
  border-radius:16px;padding:11px 20px;text-align:center;transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{display:block;font-size:15px}
.toast span{font-size:13px;color:var(--muted)}

/* ── 하단 도크 ── */
.dock{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:var(--gb);width:min(760px,calc(100% - var(--gl) - var(--gr)));border-radius:22px;padding:16px 18px 14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px}
.status{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.status .tx{min-width:0;display:grid;line-height:1.3}
.status b{font-size:15px;font-weight:700}
.status small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
.actions{display:flex;gap:8px}
.btn{height:40px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.progress{width:100%;display:grid;gap:7px}
.bar{display:flex;gap:4px;height:8px}
.bseg{position:relative;background:var(--track);border-radius:4px;overflow:hidden}
.bseg .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:4px}
.bseg .tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.45);z-index:1}
.blabels{display:flex;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.blabels div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.blabels b{color:var(--ink);font-weight:600;margin-right:5px}

/* ── 로딩 ── */
.loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;align-content:center;gap:18px;background:var(--stage);color:var(--ink);transition:opacity .5s}
.loading.out{opacity:0;pointer-events:none}
.loading b{font-family:var(--serif);font-weight:900;font-size:28px;letter-spacing:.02em}
.loading span{font-size:14px;color:var(--muted)}
.lbar{width:180px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.lbar i{display:block;width:40%;height:100%;background:var(--gold-hi);border-radius:2px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){ .lbar i{animation:none;width:100%} .chev,.toast,.loading,.switch::after{transition:none} }

/* ── 좁은 화면 ── */
@media (max-width:720px){
  .bar-l,.bar-r{height:48px;padding:0 4px}
  .period{padding:0 8px;gap:6px}
  .period small,.clock small{display:none}
  .period b{font-size:15px}
  .clock{padding:0 8px}
  .clock b{font-size:16px}
  .menu{right:var(--gr);width:auto;top:calc(var(--gt) + 56px);max-height:55vh}
  .sheet{left:var(--gl);width:auto;top:auto;bottom:var(--gb);max-height:78vh;padding:18px 16px 16px}
  .dock{padding:14px 14px 12px;gap:12px 14px}
  .big{font-size:28px}
  .actions{order:5;width:100%}
  .actions .btn{flex:1}
}
@media (max-width:480px){
  .period .lbl,.sep,.clock{display:none}
  .online{margin:0 2px 0 2px}
  .dday{height:32px;padding:0 9px;font-size:13px}
  .period{padding:0 6px;margin-left:2px}
  .ibtn{width:36px;height:36px}
  .clock{padding:0 4px 0 8px}
}
</style>
</head>
<body>

<div id="scene"></div>
<div class="loading" id="loading"><b>온라인 수능 고사장</b><div class="lbar"><i></i></div><span>고사실을 준비하는 중</span></div>

<header class="topbar">
  <div class="bar-l glass">
    <span class="dday" id="dday"></span>
    <button class="period" id="periodBtn" aria-expanded="false" aria-controls="menu">
      <span class="t"><b id="periodName">1교시 국어</b><small id="periodTime">08:40 – 10:00</small></span>
      <svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>
    </button>
  </div>
  <div class="bar-r glass">
    <label class="online roomSel" data-tip="고사실 바꾸기 — 같은 고사실끼리만 서로 보여요">
      <select id="roomSel" aria-label="고사실 선택">
        <option value="01">고사실 1</option>
        <option value="02">고사실 2</option>
        <option value="03">고사실 3</option>
        <option value="04">고사실 4</option>
      </select>
    </label>
    <span class="online" id="online" data-tip=""><i></i><b id="onlineN">혼자</b></span>
    <span class="clock"><b id="clockText">--:--:--</b><small>남은 시간</small></span>
    <span class="sep"></span>
    <button class="ibtn" id="setBtn" data-tip="설정" aria-label="설정" aria-pressed="false" aria-controls="sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
    </button>
    <button class="ibtn" id="muteBtn" data-tip="모든 소리 끄기" aria-label="모든 소리 끄기">
      <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    </button>
  </div>
</header>

<nav class="menu glass" id="menu" aria-label="시험 일정" hidden></nav>

<aside class="sheet glass" id="sheet" hidden role="dialog" aria-label="설정">
  <div class="sheet-head"><h2>설정</h2>
    <button class="xbtn" id="sheetClose" aria-label="닫기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>
  <div class="me-box">
    <label for="nameIn">내 이름</label>
    <div class="name-row"><input id="nameIn" maxlength="12" autocomplete="off" spellcheck="false"><button class="textbtn" id="nameSave">바꾸기</button></div>
    <small>같은 고사실에 있는 다른 사람에게 보이는 이름이에요</small>
  </div>
  <div class="master">
    <div><b>내가 듣는 소리</b><small id="masterNote">세 가지 소리를 내 취향대로</small></div>
    <button class="switch" id="masterSw" role="switch" aria-checked="true" aria-label="모든 소리"></button>
  </div>
  <div class="cards">
    <section class="snd" id="cardBell">
      <div class="snd-head">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></span>
        <span class="tx"><b>타종</b><small>시험장 종소리와 안내 방송</small></span>
        <button class="pill" id="bellOn" aria-pressed="true">켜짐</button>
      </div>
      <div class="snd-body">
        <div class="vol"><input type="range" id="bellVol" min="0" max="100" aria-label="타종 크기"><output id="bellVolOut"></output></div>
        <button class="textbtn" id="bellTest">본령 종소리 들어보기</button>
      </div>
    </section>
    <section class="snd" id="cardNoise">
      <div class="snd-head">

  e.preventDefault(); if(ME.seat!==null) standUp(); ME.path=[]; ME.pending=null; keys.add(k); });
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) keys.delete(k); });
addEventListener('blur',()=>keys.clear());

const SPEED=2.3;
function stepMe(dt){
  let mx=0,mz=0;
  if(keys.size&&ME.seat===null){
    const f=(keys.has('f')?1:0)-(keys.has('b')?1:0), r=(keys.has('r')?1:0)-(keys.has('l')?1:0);
    mx=-Math.sin(fYaw)*f+Math.cos(fYaw)*r; mz=-Math.cos(fYaw)*f-Math.sin(fYaw)*r;
    const n=Math.hypot(mx,mz); if(n){ mx/=n; mz/=n; }
  } else if(ME.path.length){
    const [tx,tz]=ME.path[0], dx=tx-ME.x, dz=tz-ME.z, d=Math.hypot(dx,dz);
    if(d<0.06){ ME.path.shift(); if(!ME.path.length&&ME.pending!==null){ const s=ME.pending; ME.pending=null; sitDown(s); } }
    else { mx=dx/d; mz=dz/d; if(d<SPEED*dt){ mx*=d/(SPEED*dt); mz*=d/(SPEED*dt); } }
  }
  ME.moving=!!(mx||mz);
  if(ME.moving){
    const nx=ME.x+mx*SPEED*dt, nz=ME.z+mz*SPEED*dt;
    if(freeAt(nx,nz)){ ME.x=nx; ME.z=nz; } else if(freeAt(nx,ME.z)) ME.x=nx; else if(freeAt(ME.x,nz)) ME.z=nz;
    ME.ry=turnTo(ME.ry,Math.atan2(-mx,-mz),Math.min(1,dt*12));
  }
  if(ME.seat===null){ meAv.g.position.x=ME.x; meAv.g.position.z=ME.z; meAv.g.rotation.y=ME.ry; }
  playerPos.set(ME.x,1,ME.z);
  // 위치 보내기 (움직이는 동안 초당 6번까지)
  const now=performance.now();
  if(ME.seat===null&&now-ME.sentAt>160&&(Math.abs(ME.x-ME.sx)>.03||Math.abs(ME.z-ME.sz)>.03||Math.abs(ME.ry-ME.sry)>.1)){
    ME.sentAt=now; ME.sx=ME.x; ME.sz=ME.z; ME.sry=ME.ry; net({t:'pos',x:+ME.x.toFixed(2),z:+ME.z.toFixed(2),ry:+ME.ry.toFixed(2)});
  }
}

// ════════════════ 접속 (Cloudflare 실시간 서버) ════════════════
const NET={ws:null,id:null,online:false,tries:0,timer:null,ping:null};
function net(m){ if(NET.ws&&NET.ws.readyState===1&&NET.online) NET.ws.send(JSON.stringify(m)); }
function myProg(){
  if(!running) return {prog:ME.seat!==null?'자리에서 대기 중':'고사실 둘러보는 중',exam:false};
  const {P,stage}=stageAt(C); return {prog:`${P.p}교시 ${P.name} · ${STAGE_UI[stage][0]}`,exam:stage==='exam'};
}
let lastProg='';
function sendProg(){ const p=myProg(), k=p.prog+p.exam; if(k===lastProg) return; lastProg=k; net({t:'prog',...p}); }
function addPeer(p){
  if(PEERS.has(p.id)) removePeer(p.id);
  const av=makeAvatar(HOODIES[p.color%9]), tag=makeTag();
  const peer={...p,av,tag,tx:p.x,tz:p.z};
  av.g.position.set(p.x,0,p.z); av.g.rotation.y=p.ry||0;
  PEERS.set(p.id,peer); return peer;
}
function removePeer(id){ const p=PEERS.get(id); if(!p) return; scene.remove(p.av.g); scene.remove(p.tag.s); p.tag.t.dispose(); PEERS.delete(id); }
function clearPeers(){ [...PEERS.keys()].forEach(removePeer); recomputeSeats(); }
const roomLabel=r=>`고사실 ${parseInt(r,10)}`;
function setOnline(on,label){
  NET.online=on; $('online').classList.toggle('on',on);
  $('onlineN').textContent=on?`${PEERS.size+1}명`:(label||'혼자');
  $('online').dataset.tip=on?`지금 ${roomLabel(ROOM)}에 있는 사람`:'다른 사람과 연결되지 않았어요. 혼자서도 그대로 쓸 수 있어요';
}
function switchRoom(r){
  if(r===ROOM) return;
  ROOM=r; saveRoom();
  const old=NET.ws; NET.ws=null; clearInterval(NET.ping); clearTimeout(NET.timer); NET.full=false; NET.tries=0;
  if(old){ try{ old.close(); }catch(e){} }
  clearPeers(); setOnline(false);
  toast(`${roomLabel(ROOM)}로 이동했어요`,'');
  connect();
}
function connect(){
  clearTimeout(NET.timer);
  if(!/^https?:$/.test(location.protocol)){ setOnline(false); return; }
  let ws; try{ ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws?room=${ROOM}`); }catch(e){ retry(); return; }
  NET.ws=ws;
  ws.onopen=()=>{ NET.tries=0; const p=myProg(); lastProg=p.prog+p.exam;
    ws.send(JSON.stringify({t:'hello',name:ME.name,color:ME.color,x:ME.x,z:ME.z,ry:ME.ry,seat:ME.seat,...p}));
    clearInterval(NET.ping); NET.ping=setInterval(()=>{ if(ws.readyState===1) ws.send('ping'); },25000); };
  ws.onmessage=ev=>{ if(ev.data==='pong') return; let m; try{ m=JSON.parse(ev.data); }catch(e){ return; } onNet(m); };
  ws.onclose=()=>{ if(NET.ws!==ws) return; clearInterval(NET.ping); const was=NET.online; clearPeers(); setOnline(false,NET.full?'만석':null); if(!NET.full) retry(was); };
  ws.onerror=()=>{};
}
function retry(was){ NET.tries++; NET.timer=setTimeout(connect,Math.min(30000,(was?1000:3000)*NET.tries)); }
function onNet(m){
  switch(m.t){
    case 'welcome':
      NET.id=m.id; clearPeers(); m.peers.forEach(addPeer);
      if(ME.seat!==null&&m.seat===null){ standUp(); }
      recomputeSeats(); setOnline(true);
      if(m.peers.length) toast(`지금 ${m.peers.length+1}명이 고사실에 있어요`,'다른 사람은 각자 자기 진도로 시험을 보고 있어요');
      break;
    case 'join': addPeer(m.peer); recomputeSeats(); setOnline(true); break;
    case 'leave': removePeer(m.id); recomputeSeats(); setOnline(true); break;
    case 'pos': { const p=PEERS.get(m.id); if(p){ p.tx=m.x; p.tz=m.z; p.ry=m.ry; } break; }
    case 'seat': { const p=PEERS.get(m.id); if(!p) break; p.seat=m.seat;
      if(m.seat===null&&m.x!==undefined){ p.x=p.tx=m.x; p.z=p.tz=m.z; p.ry=m.ry; p.av.g.position.set(m.x,0,m.z); }
      if(m.seat!==null&&ME.pending===m.seat){ ME.path=[]; ME.pending=null; toast('방금 다른 수험생이 그 자리에 앉았어요','다른 빈 자리를 골라 주세요'); }
      recomputeSeats(); break; }
    case 'seat-taken':
      if(ME.seat===m.seat){ standUp(); toast('다른 수험생이 먼저 앉은 자리예요','다른 빈 자리를 골라 주세요'); }
      break;
    case 'prog': { const p=PEERS.get(m.id); if(p){ p.prog=m.prog; p.exam=m.exam; } break; }
    case 'name': { const p=PEERS.get(m.id); if(p) p.name=m.name; break; }
    case 'full': NET.full=true; toast('고사실이 가득 찼어요','혼자 보기로 계속할 수 있어요'); break;
  }
}
function stepPeers(dt,t){
  PEERS.forEach(p=>{
    const g=p.av.g; let moving=false;
    if(p.seat!==null){ const s=SEATS[p.seat]; g.position.x=s.sx; g.position.z=s.sz; g.rotation.y=0; }
    else { const dx=p.tx-g.position.x, dz=p.tz-g.position.z, d=Math.hypot(dx,dz); moving=d>.03;
      const k=Math.min(1,dt*7); g.position.x+=dx*k; g.position.z+=dz*k; g.rotation.y=turnTo(g.rotation.y,p.ry||0,Math.min(1,dt*10)); }
    poseAvatar(p.av,dt,t,p.seat!==null,moving,p.seat!==null&&p.exam);
    drawTag(p.tag,p.name,p.prog,false,p.exam); p.tag.s.position.set(g.position.x,p.seat!==null?1.95:2.05,g.position.z);
  });
}

// ════════════════ 오디오 ════════════════
function ensureAudio(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
let noiseBuf=null;
function getNoise(){
  if(!noiseBuf){ const len=audioCtx.sampleRate*2; noiseBuf=audioCtx.createBuffer(1,len,audioCtx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
  return noiseBuf;
}
function outNode(vol,pan){
  const g=audioCtx.createGain(); g.gain.value=vol;
  if(audioCtx.createStereoPanner){ const p=audioCtx.createStereoPanner(); p.pan.value=clamp(pan||0,-1,1); g.connect(p); p.connect(audioCtx.destination); }
  else g.connect(audioCtx.destination);
  return g;
}
function burst(dest,t,dur,type,freq,q,peak,attack){
  const src=audioCtx.createBufferSource(); src.buffer=getNoise();
  const f=audioCtx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=audioCtx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f).connect(g).connect(dest); src.start(t,Math.random()*1.5); src.stop(t+dur+.05);
}

// 타종 (bells/ 폴더의 음원)
const bellCache={}; let bellSrc=null, bellGain=null, bellToken=0;
const bellLevel=()=>SET.sound&&SET.bellOn?SET.bellVol:0;
function bellBuffer(id){
  if(!bellCache[id]&&ensureAudio()){
    bellCache[id]=fetch(`bells/${id}.mp3`).then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(b=>audioCtx.decodeAudioData(b)).catch(()=>null);
  }
  return bellCache[id]||Promise.resolve(null);
}
function stopBell(){ bellToken++; if(bellSrc){ try{ bellSrc.stop(); }catch(e){} bellSrc=null; } }
function ding(v){
  const t0=audioCtx.currentTime+.05;
  [880,659.25].forEach((f,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=f;
    const st=t0+i*.5; g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(.2*v,st+.015); g.gain.exponentialRampToValueAtTime(.0001,st+1.6);
    o.connect(g).connect(audioCtx.destination); o.start(st); o.stop(st+1.7); });
}
async function playBell(id,preview){
  const v=preview?SET.bellVol:bellLevel(); if(!v||!ensureAudio()) return;
  stopBell(); const my=bellToken;
  if(!id){ ding(v); return; }
  const buf=await bellBuffer(id);
  if(my!==bellToken||(!preview&&!running)) return;
  if(!buf){ ding(v); return; }
  bellSrc=audioCtx.createBufferSource(); bellSrc.buffer=buf; bellGain=audioCtx.createGain(); bellGain.gain.value=v;
  bellSrc.connect(bellGain).connect(audioCtx.destination); bellSrc.start();
}
function applyBellVol(){ if(bellGain&&audioCtx) bellGain.gain.setTargetAtTime(bellLevel(),audioCtx.currentTime,.05); }

// 영어 듣기 (listening/ 폴더의 음원). 재생 방식이 막히면 다음 방식으로 넘어간다
let la=null, laId=null, laMode=0, lbuf=null, lbufId=null, lsrc=null, lgain=null;
const listenLevel=()=>SET.sound&&SET.listenOn?SET.listenVol:0;
function listenOffset(){
  if(!running||!SET.listenOn||!LISTEN[SET.listenSel]) return -1;
  const off=C-ENG.s; return off>=0&&off<LISTEN[SET.listenSel].dur?off:-1;
}
function stopListening(){ if(la&&!la.paused) la.pause(); if(lsrc){ try{ lsrc.stop(); }catch(e){} lsrc=null; } }
function makeListenEl(){
  if(la&&laId===SET.listenSel) return;
  if(la){ la.pause(); if(la.src.startsWith('blob:')) URL.revokeObjectURL(la.src); }
  const id=SET.listenSel; laId=id;
  const el=new Audio(); el.preload='auto'; la=el;
  el.addEventListener('error',async()=>{
    if(la!==el) return;
    if(laMode===0){ laMode=1; try{ const r=await fetch(`listening/${id}.mp3`); const b=await r.blob(); if(la!==el) return; el.src=URL.createObjectURL(b); el.load(); }catch(e){ laMode=2; la=null; } }
    else { laMode=2; la=null; }
  });
  if(laMode===0) el.src=`listening/${id}.mp3`;
  else fetch(`listening/${id}.mp3`).then(r=>r.blob()).then(b=>{ if(la===el){ el.src=URL.createObjectURL(b); el.load(); } }).catch(()=>{ laMode=2; la=null; });
}
function primeListening(){   // 사용자의 클릭 안에서 재생 권한을 미리 받아 둔다
  if(!SET.listenOn||laMode===2) return;
  makeListenEl(); const el=la; if(!el) return; el.muted=true;
  const p=el.play(); if(p&&p.then) p.then(()=>{ if(listenOffset()<0) el.pause(); el.muted=false; }).catch(()=>{ el.muted=false; });
}
function syncListening(){
  const off=listenOffset();
  if(off<0){ stopListening(); return; }
  if(laMode===2){   // 마지막 방법: 파일을 받아 직접 재생
    if(lbufId!==SET.listenSel){ lbufId=SET.listenSel; lbuf=null; const id=lbufId;
      fetch(`listening/${id}.mp3`).then(r=>r.arrayBuffer()).then(b=>audioCtx.decodeAudioData(b)).then(buf=>{ if(lbufId===id) lbuf=buf; }).catch(()=>{}); return; }
    if(lbuf&&!lsrc&&ensureAudio()){ lsrc=audioCtx.createBufferSource(); lsrc.buffer=lbuf; lgain=audioCtx.createGain(); lgain.gain.value=listenLevel();
      lsrc.connect(lgain).connect(audioCtx.destination); lsrc.start(0,off); const s=lsrc; s.onended=()=>{ if(lsrc===s) lsrc=null; }; }
    if(lgain) lgain.gain.value=listenLevel();
    return;
  }
  makeListenEl(); if(!la) return;
  la.muted=false; la.volume=listenLevel();
  if(la.readyState>=1&&Math.abs(la.currentTime-off)>2){ try{ la.currentTime=off; }catch(e){} }
  if(la.paused){ const p=la.play(); if(p&&p.catch) p.catch(()=>{}); }
}

// 교실 소음
const NOISE_MIN={step:18,cough:11,sharp:7,paper:7};
const timers={}; Object.keys(NOISE_MIN).forEach(k=>timers[k]=NOISE_MIN[k]*(0.3+Math.random()));
const noiseLevel=()=>SET.sound&&SET.noiseOn?SET.noiseVol:0;
const SFX={
  step(vol,pan){ const o=outNode(vol,pan), t=audioCtx.currentTime;
    burst(o,t,.12,'lowpass',380,.7,.9,.004);
    const os=audioCtx.createOscillator(), g=audioCtx.createGain(); os.frequency.setValueAtTime(90,t); os.frequency.exponentialRampToValueAtTime(45,t+.1);
    g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0001,t+.12); os.connect(g).connect(o); os.start(t); os.stop(t+.15); },
  cough(vol,pan){ const o=outNode(vol,pan), t=audioCtx.currentTime;
    const one=(at,pk)=>{ burst(o,at,.22,'bandpass',650,1.1,pk,.008); burst(o,at+.01,.18,'bandpass',1500,1.4,pk*.45,.008);
      const os=audioCtx.createOscillator(), lp=audioCtx.createBiquadFilter(), g=audioCtx.createGain(); os.type='sawtooth'; os.frequency.setValueAtTime(190,at); os.frequency.linearRampToValueAtTime(140,at+.15);
      lp.type='lowpass'; lp.frequency.value=900; g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(pk*.12,at+.01); g.gain.exponentialRampToValueAtTime(.0001,at+.16);
      os.connect(lp).connect(g).connect(o); os.start(at); os.stop(at+.2); };
    one(t,1); if(Math.random()<.7) one(t+.3+Math.random()*.1,.7); if(Math.random()<.3) one(t+.62,.5); },
  sharp(vol,pan){ const o=outNode(vol,pan), t=audioCtx.currentTime, n=2+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){ const at=t+i*(.11+Math.random()*.05); burst(o,at,.022,'highpass',2600,.7,1,.001);
      const os=audioCtx.createOscillator(), g=audioCtx.createGain(); os.frequency.value=3300+Math.random()*400; g.gain.setValueAtTime(.18,at); g.gain.exponentialRampToValueAtTime(.0001,at+.025); os.connect(g).connect(o); os.start(at); os.stop(at+.03); } },
  paper(vol,pan){ const o=outNode(vol,pan), t=audioCtx.currentTime;
    const src=audioCtx.createBufferSource(); src.buffer=getNoise();
    const f=audioCtx.createBiquadFilter(); f.type='bandpass'; f.Q.value=.8; f.frequency.setValueAtTime(700,t); f.frequency.exponentialRampToValueAtTime(2800,t+.28);
    const g=audioCtx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.9,t+.06); g.gain.linearRampToValueAtTime(.5,t+.2); g.gain.exponentialRampToValueAtTime(.0001,t+.42);
    src.connect(f).connect(g).connect(o); src.start(t,Math.random()); src.stop(t+.5);
    for(let i=0;i<4;i++) burst(o,t+.05+Math.random()*.3,.03,'highpass',3500,.7,.35,.002); },
};
let whiteGain=null;
function startWhite(){
  if(!ensureAudio()||whiteGain) return;
  const src=audioCtx.createBufferSource(); src.buffer=getNoise(); src.loop=true;
  const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650;
  const hp=audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=70;
  whiteGain=audioCtx.createGain(); whiteGain.gain.value=0;
  src.connect(lp).connect(hp).connect(whiteGain).connect(audioCtx.destination); src.start();
}
function updateWhite(){ if(whiteGain) whiteGain.gain.setTargetAtTime(running?PRESETS[SET.preset].white*noiseLevel()*.16:0,audioCtx.currentTime,.4); }
const attenuate=(x,z)=>{ const d=Math.hypot(x-playerPos.x,z-playerPos.z); return clamp(1.8/(d+.6),.22,1); };
function playAt(id,x,z,force){
  const v=force?SET.noiseVol:noiseLevel(); if(!v||!ensureAudio()) return;
  const quiet=listenOffset()>=0?.5:1;   // 듣기평가 중에는 소음을 줄인다
  SFX[id](v*(.35+.65*PRESETS[SET.preset][id])*attenuate(x,z)*quiet,(x-playerPos.x)/4.5);
}
function walkBy(){
  const aisle=[-3,-1,1,3,5][Math.floor(Math.random()*5)], dir=Math.random()<.5?1:-1;
  const z0=dir>0?-4:5, n=8+Math.floor(Math.random()*8);
  for(let i=0;i<n;i++) setTimeout(()=>{ if(running) playAt('step',aisle,z0+dir*i*.6); },i*(560+Math.random()*60));
}
const ACTIVE={step:['entry','yebi','junbi','exam','swap','break'],cough:['entry','yebi','junbi','exam','swap'],sharp:['yebi','junbi','exam','swap'],paper:['exam']};
function stepNoises(dt){
  if(!running) return;
  const st=stageAt(C).stage, P=PRESETS[SET.preset];
  Object.keys(NOISE_MIN).forEach(id=>{
    if(!ACTIVE[id].includes(st)) return;
    timers[id]-=dt; if(timers[id]>0) return;
    timers[id]=NOISE_MIN[id]*(1+(1-P[id])*4)*(.35+Math.random()*0.9);
    if(id==='step'){ walkBy(); return; }
    const src=[...npcSeats].map(i=>npcAv[i]).concat([...PEERS.values()].filter(q=>q.seat!==null).map(q=>q.av)); if(!src.length) return;
    const s=src[Math.floor(Math.random()*src.length)], p=s.g.position;
    playAt(id,p.x,p.z);
    if(id==='cough') s.coughT=.7; if(id==='paper') s.flipT=.6;
  });
}

// ════════════════ 교시 메뉴 (아코디언) ════════════════
const openGroups=new Set();
let menuKey='';
const CHEV='<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>';
function renderMenu(force){
  if($('menu').hidden&&!force) return;
  const cur=running?EVENTS.filter(e=>e.t<=C).pop():null, curP=stageAt(C).P;
  const key=(cur?cur.i:-1)+'|'+curP.id+'|'+[...openGroups].join(',');
  if(key===menuKey&&!force) return; menuKey=key;
  $('menu').innerHTML=PERIODS.map(P=>{
    const open=openGroups.has(P.id);
    return `<button class="grp${P===curP?' cur':''}" data-g="${P.id}" aria-expanded="${open}">${CHEV}<span class="num">${P.p}</span><span class="nm">${P.name}</span><time>${P.start} – ${P.end}</time></button>`+
      (open?`<div class="evs">${P.events.map(e=>{
        const cls=cur&&e.i===cur.i?'now':(running&&e.t<C?'past':'');
        return `<button class="ev ${cls}${e.kind==='start'?' main':''}" data-i="${e.i}"><span>${e.label}</span><time>${hhmm(e.t)}</time></button>`; }).join('')}</div>`:'');
  }).join('');
}
function setMenu(open){
  if(open){ openGroups.clear(); openGroups.add(stageAt(C).P.id); setSheet(false); }
  $('menu').hidden=!open; $('periodBtn').setAttribute('aria-expanded',open); renderMenu(true);
  if(open){ const now=$('menu').querySelector('.now'); if(now) now.scrollIntoView({block:'nearest'}); }
}
$('periodBtn').onclick=()=>setMenu($('menu').hidden);
$('menu').addEventListener('click',ev=>{
  const g=ev.target.closest('.grp');
  if(g){ const id=g.dataset.g; if(openGroups.has(id)) openGroups.delete(id); else openGroups.add(id); renderMenu(true); return; }
  const b=ev.target.closest('.ev'); if(!b) return;
  go(+b.dataset.i); if(innerWidth<=720) setMenu(false);
});

// ════════════════ 소리 설정 시트 ════════════════
const mmss=s=>`${Math.floor(s/60)}분 ${String(s%60).padStart(2,'0')}초`;
function setRange(id,v){ const el=$(id); el.value=Math.round(v*100); el.style.setProperty('--p',el.value+'%'); $(id+'Out').textContent=el.value+'%'; }
function renderSheet(){
  if(document.activeElement!==$('nameIn')) $('nameIn').value=ME.name;
  $('masterSw').setAttribute('aria-checked',SET.sound);
  $('masterNote').textContent=SET.sound?'세 가지 소리를 내 취향대로':'지금은 모든 소리가 꺼져 있어요';
  [['bellOn','cardBell'],['listenOn','cardListen'],['noiseOn','cardNoise']].forEach(([k,card])=>{
    const on=SET[k]; $(k).setAttribute('aria-pressed',on); $(k).textContent=on?'켜짐':'꺼짐';
    $(card).classList.toggle('dim',!on||!SET.sound); });
  setRange('bellVol',SET.bellVol); setRange('listenVol',SET.listenVol); setRange('noiseVol',SET.noiseVol);
  $('years').innerHTML=LISTEN_YEARS.map(y=>`<button data-y="${y}" aria-pressed="${y===listenYear}">${y}학년도</button>`).join('');
  $('rounds').innerHTML=LISTEN_KINDS.filter(([m])=>LISTEN[`${listenYear}-${m}`]).map(([m,nm])=>{ const id=`${listenYear}-${m}`;
    return `<button class="round" data-id="${id}" aria-pressed="${id===SET.listenSel}"><span class="dot"></span><span class="nm">${nm}</span><time>${mmss(LISTEN[id].dur)}</time></button>`; }).join('');
  $('listenSub').textContent=listenName(SET.listenSel);
  document.querySelectorAll('#presets button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.preset===SET.preset));
  $('presetNote').textContent=PRESETS[SET.preset].label;
  const muted=!SET.sound; $('muteBtn').classList.toggle('off',muted);
  const tip=muted?'소리 켜기':'모든 소리 끄기'; $('muteBtn').dataset.tip=tip; $('muteBtn').setAttribute('aria-label',tip);
  $('muteIcon').innerHTML=muted?'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>':'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/>';
}
function applySound(){
  saveSet(); renderSheet(); applyBellVol(); updateWhite();
  if(!SET.sound||!SET.bellOn) stopBell();
  if(!SET.sound||!SET.listenOn) stopListening(); else syncListening();
}
function setSheet(open){ if(open) setMenu(false); $('sheet').hidden=!open; $('setBtn').setAttribute('aria-pressed',open); if(open) renderSheet(); }
$('roomSel').value=ROOM; $('roomSel').onchange=e=>switchRoom(e.target.value);
$('setBtn').onclick=()=>setSheet($('sheet').hidden);
$('sheetClose').onclick=()=>setSheet(false);
$('masterSw').onclick=()=>{ SET.sound=!SET.sound; ensureAudio(); applySound(); };
$('muteBtn').onclick=()=>{ SET.sound=!SET.sound; ensureAudio(); applySound(); toast(SET.sound?'소리를 켰어요':'모든 소리를 껐어요',''); };
['bellOn','listenOn','noiseOn'].forEach(k=>$(k).onclick=()=>{ SET[k]=!SET[k]; ensureAudio(); if(k==='listenOn'&&SET[k]&&running) primeListening(); applySound(); });
['bellVol','listenVol','noiseVol'].forEach(k=>$(k).addEventListener('input',e=>{ SET[k]=e.target.value/100; setRange(k,SET[k]);
  applyBellVol(); updateWhite(); if(la) la.volume=listenLevel(); if(lgain) lgain.gain.value=listenLevel(); }));
['bellVol','listenVol','noiseVol'].forEach(k=>$(k).addEventListener('change',saveSet));
$('bellTest').onclick=()=>playBell('005',true);
$('years').addEventListener('click',e=>{ const b=e.target.closest('[data-y]'); if(!b) return; listenYear=+b.dataset.y; renderSheet(); });
$('rounds').addEventListener('click',e=>{ const b=e.target.closest('.round'); if(!b) return; SET.listenSel=b.dataset.id;
  stopListening(); if(running) primeListening(); applySound(); toast('영어 듣기 음원',listenName(SET.listenSel)); });
$('presets').addEventListener('click',e=>{ const b=e.target.closest('[data-preset]'); if(!b) return; SET.preset=b.dataset.preset; ensureAudio(); applySound();
  const src=[...npcSeats].map(i=>npcAv[i]); if(src.length){ const s=src[Math.floor(Math.random()*src.length)]; s.coughT=.7; playAt('cough',s.g.position.x,s.g.position.z,true); } });
$('listenGo').onclick=()=>{ setSheet(false); go(ENG_START_IDX); };
function closePanels(){ if(innerWidth<=720) setMenu(false); setSheet(false); }

// ════════════════ 진행 표시 ════════════════
let barFor=null;
const SEG_COLOR={entry:'var(--entry)',yebi:'var(--yebi)',junbi:'var(--junbi)',start:'var(--exam)',swap:'var(--swap)'};
function buildBar(P){
  barFor=P;
  const total=P.e-P.bs, minW=.1;
  let ws=P.segs.map(s=>Math.max((s.to-s.from)/total,minW)); const sum=ws.reduce((a,b)=>a+b,0); ws=ws.map(w=>w/sum);
  const warn=P.events.find(e=>e.kind==='warn');
  $('bar').innerHTML=P.segs.map((s,i)=>{
    const tick=s.kind==='start'&&warn?`<span class="tick" style="left:${(warn.t-s.from)/(s.to-s.from)*100}%"></span>`:'';
    return `<div class="bseg" style="flex:${ws[i]} 0 0"><div class="fill" id="fill${i}" style="background:${SEG_COLOR[s.kind]}"></div>${tick}</div>`;
  }).join('');
  $('barLabels').innerHTML=P.segs.map((s,i)=>`<div style="flex:${ws[i]} 0 0"><b>${s.name}</b>${hhmm(s.from)}${s.kind==='start'?' – '+hhmm(s.to):''}</div>`).join('');
}
const fmt=s=>{ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s%60).padStart(2,'0'); };
const clockStr=c=>{ const x=Math.floor(c); return [Math.floor(x/3600)%24,Math.floor(x%3600/60),x%60].map(v=>String(v).padStart(2,'0')).join(':'); };
const STAGE_UI={break:['쉬는 시간','var(--muted)'],entry:['입실','var(--entry)'],yebi:['예비령','var(--yebi)'],junbi:['준비령','var(--junbi)'],swap:['문제지 교체','var(--swap)'],exam:['시험 중','var(--exam)'],done:['시험 종료','var(--muted)']};
function updateHud(){
  const {P,stage}=stageAt(C);
  if(barFor!==P) buildBar(P);
  $('clockText').textContent=fmt(Math.max(0,DAY_END-C));
  $('periodName').innerHTML=`${P.p}교시<span class="lbl"> ${P.name}</span>`; $('periodTime').textContent=`${P.start} – ${P.end}`;
  const late=running&&stage==='exam'&&P.e-C<=600;
  $('actStart').hidden=running; $('actEnd').hidden=!running;
  if(!running){
    $('plabel').textContent='대기 중'; $('pdot').style.background='var(--muted)'; $('bigTime').textContent=clockStr(C);
    $('bsub').textContent=ME.seat!==null?'시작을 누르면 08:10 입실 완료부터 진행돼요':'바닥을 누르면 걸어가요. 빈 자리를 누르면 가서 앉아요';
  } else {
    $('plabel').textContent=STAGE_UI[stage][0]; $('pdot').style.background=late?'var(--late)':STAGE_UI[stage][1];
    const left=s=>{ const m=Math.ceil(Math.max(0,s)/60); return m>=60?`${Math.floor(m/60)}시간 ${m%60}분 남음`:`${m}분 남음`; };
    $('bigTime').textContent=clockStr(C);
    if(stage==='done') $('bsub').textContent='오늘 시험이 모두 끝났어요';
    else if(stage==='exam') $('bsub').textContent=P===ENG&&listenOffset()>=0?`듣기평가 방송 중 · ${listenName(SET.listenSel)}`:`종료 ${P.end}까지 ${left(P.e-C)}`;
    else if(stage==='break'){ const nx=EVENTS.find(e=>e.t>C); $('bsub').textContent=nx?`${nx.label} ${hhmm(nx.t)}까지 ${left(nx.t-C)}`:''; }
    else $('bsub').textContent=`본령 ${P.start}까지 ${left(P.s-C)}`;
  }
  P.segs.forEach((s,i)=>{ const k=running?clamp((C-s.from)/(s.to-s.from),0,1):0; const f=$('fill'+i); if(f){ f.style.width=(k*100)+'%'; if(s.kind==='start') f.style.background=late?'var(--late)':'var(--exam)'; } });
  drawNowCard();
  const omrOn=running&&['yebi','junbi','exam','swap'].includes(stage), paperOn=running&&['junbi','exam','swap'].includes(stage);
  SEATS.forEach(st=>{ const show=npcSeats.has(st.i)||ME.seat===st.i; st.om.visible=show&&omrOn; st.pm.visible=show&&paperOn; });
  const ns=nearSeat(), sb=$('actSit');
  if(ME.seat!==null){ sb.hidden=false; sb.textContent='일어나기'; }
  else if(ns!==null){ sb.hidden=false; sb.textContent=`${ns+1}번 자리에 앉기`; sb.dataset.seat=ns; }
  else sb.hidden=true;
  sendProg();
}
let toastTimer=null;
function toast(title,text){ $('toastTitle').textContent=title; $('toastText').textContent=text; $('toastText').hidden=!text; $('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').classList.remove('show'),5000); }

// ════════════════ 진행 ════════════════
function fire(e){
  if(e.i===ENG_START_IDX){
    toast(e.label,SET.listenOn?`${listenName(SET.listenSel)} 듣기평가`:`${hhmm(e.t)}  본령, 시험 시작`);
    if(!SET.listenOn) playBell(null); return;
  }
  toast(e.label,`${hhmm(e.t)}  ${KIND_TOAST[e.kind]}`); playBell(e.file);
}
function tickSim(){
  if(running){
    C=Math.min(DAY_END,C0+(performance.now()-startReal)/1000);
    while(nextEv<EVENTS.length&&EVENTS[nextEv].t<=C){ fire(EVENTS[nextEv]); nextEv++; }
    const nx=EVENTS[nextEv]; if(nx&&nx.file&&nx.t-C<90) bellBuffer(nx.file);
    if(C>=DAY_END){ stop(); toast('시험 종료','오늘 일정이 모두 끝났어요'); }
  }
  syncListening(); updateHud(); drawBigClock(C); drawSky(C); renderMenu();
}
function go(i){   // i번째 일정부터 시작 (진행 중이면 그 시각으로 이동)
  ensureAudio(); stopBell(); stopListening();
  C0=EVENTS[i].t; C=C0; nextEv=i; startReal=performance.now(); running=true;
  startWhite(); updateWhite(); primeListening();
  nowKey=''; tickSim(); drawBigClock(C,true);
}
function stop(){ running=false; stopBell(); stopListening(); updateWhite(); updateHud(); drawBigClock(C,true); renderMenu(true); }

// ════════════════ 애니메이션 ════════════════
let last=performance.now(), simAcc=0;
function animate(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now; const t=now/1000;
  simAcc+=dt; if(simAcc>0.2){ simAcc=0; tickSim(); }
  const writing=running&&stageAt(C).stage==='exam';
  stepMe(dt);
  poseAvatar(meAv,dt,t,ME.seat!==null,ME.moving,ME.seat!==null&&writing);
  drawTag(meTag,ME.name,'',true,false); meTag.s.position.set(meAv.g.position.x,ME.seat!==null?1.95:2.05,meAv.g.position.z);
  npcSeats.forEach(i=>poseAvatar(npcAv[i],dt,t,true,false,writing));
  stepPeers(dt,t);
  markerT=Math.max(0,markerT-dt*.8); marker.material.opacity=markerT*.9; marker.scale.setScalar(1+(1-markerT)*.6);
  if(hoverSeat!==null&&!seatOwner(hoverSeat)){ hoverRing.position.x=SEATS[hoverSeat].sx; hoverRing.position.z=SEATS[hoverSeat].sz-.25; hoverRing.material.opacity=.85; } else hoverRing.material.opacity=0;
  if(focusClock>0) focusClock-=dt;
  stepNoises(dt); placeCamera();
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}

// ════════════════ 연결 ════════════════
$('actStart').onclick=()=>go(0);
$('actEnd').onclick=()=>{ stop(); toast('끝냈어요','교시 이름을 눌러 다시 시작할 구간을 고르세요'); };
$('actClock').onclick=()=>{ focusClock=focusClock>0?0:5; };
$('actSit').onclick=()=>{ if(ME.seat!==null) standUp(); else if($('actSit').dataset.seat!==undefined) sitDown(+$('actSit').dataset.seat); updateHud(); };
function saveName(){ const v=$('nameIn').value.replace(/[\u0000-\u001f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,12);
  if(!v){ $('nameIn').value=ME.name; return; } if(v===ME.name) return; ME.name=v; saveMe(); net({t:'name',name:v}); toast('이름을 바꿨어요',v); }
$('nameSave').onclick=saveName;
$('nameIn').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); saveName(); $('nameIn').blur(); } });
addEventListener('keydown',e=>{ if(e.key==='Escape'){ setMenu(false); setSheet(false); } });

(function(){ const ns=nextSuneung(); const el=$('dday'); if(ns){ el.textContent='수능 '+ns.label; el.title=`${ns.y}학년도 수능 ${ns.date.getMonth()+1}월 ${ns.date.getDate()}일`; } else el.hidden=true; })();
renderSheet();
const fontReady=document.fonts?Promise.all([document.fonts.load('900 60px "Noto Serif KR"'),document.fonts.load('700 40px "IBM Plex Sans KR"')]).catch(()=>{}):Promise.resolve();
Promise.race([fontReady,new Promise(r=>setTimeout(r,2500))]).then(()=>{
  drawCards(); updateHud(); drawBigClock(C,true); drawSky(C);
  camera.position.set(ME.x+3,3.5,ME.z+3); requestAnimationFrame(animate); setOnline(false); connect();
  setTimeout(()=>{ $('loading').classList.add('out'); setTimeout(()=>$('loading').remove(),600);
    toast('바닥을 누르면 걸어가요',matchMedia('(hover:hover)').matches?'빈 자리를 누르면 가서 앉아요 · WASD나 방향키로도 움직여요':'빈 자리를 누르면 가서 앉아요'); },500);
});
</script>
